name: Update FHMMoscow data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "update-fhm-data"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update data files
        run: node ./update_fhm_2016_stats.mjs

      - name: Detect data changes
        id: changes
        shell: bash
        run: |
          git add all_2016_players_season5.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update FHMMoscow stats"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: git push

      - name: No changes
        if: steps.changes.outputs.changed != 'true'
        run: echo "No data changes detected; nothing to commit."